name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Reachable vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: build (release)
        run: go build -ldflags="-H windowsgui" -o AgentFocus.exe ./cmd/agentfocus
