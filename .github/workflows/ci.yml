name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build / vet / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build (release)
        run: go build -ldflags="-H windowsgui" -o AgentFocus.exe ./cmd/agentfocus
